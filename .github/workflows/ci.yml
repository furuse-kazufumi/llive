name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Python 3.12 は pyproject `<3.12` 制約で除外
        # (memory project_python_311_unification 整合).
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + verify Z3 extras)
        # `[verify]` で Z3 SMT 検証レイヤを引き、tests/unit/test_verifier.py が通る。
        # `[torch]` は HF/faiss/peft 等の重い依存を引くため CI では入れない (別 matrix で扱う)。
        run: pip install -e ".[verify,dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests with coverage
        run: python -m pytest --cov=llive --cov-fail-under=80 -q

  rust-build:
    name: Rust extension build (pyo3 0.24.2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release (legacy crates/llive_rust_ext, RUST-01/02/04)
        working-directory: crates/llive_rust_ext
        run: cargo build --release

      - name: cargo test rust_ext (RUST-15 PeerScoreMatrixOps, pure Rust)
        working-directory: rust_ext
        run: cargo test --no-default-features --release

      - name: Install Python + maturin for parity harness
        run: |
          pip install -e ".[verify,dev]"
          pip install maturin

      - name: Build legacy crates/llive_rust_ext via maturin
        run: maturin develop --release --manifest-path crates/llive_rust_ext/Cargo.toml

      - name: Run legacy parity test (RUST-01/02/04)
        run: python -m pytest tests/property/test_rust_python_parity.py -q

      - name: Build new rust_ext (RUST-15) via maturin
        run: pip install -e ./rust_ext

      - name: Run new RUST-15 parity test
        run: python -m pytest tests/unit/test_rust_ext_parity.py -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Verify dist files
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: llive-dist
          path: dist/*
