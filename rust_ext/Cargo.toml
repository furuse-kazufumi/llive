[package]
name = "llive_peer_rust_ext"
version = "0.1.0"
edition = "2021"
authors = ["furuse-kazufumi <kazufumi@furuse.work>"]
license = "Apache-2.0"
description = "llive Rust acceleration layer — RUST-15+ hotspot ports"

[lib]
name = "llive_peer_rust_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 + numpy for Python/Rust FFI
# 実 build は次セッション (maturin develop). 本 skeleton では interface のみ.
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = "0.16"
rayon = "1.10"

[features]
default = []
# 'python' feature を有効化すると pyo3 binding が生成される (maturin で build)
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
approx = "0.5"  # bit-exact parity assertion 用
proptest = "1.5"  # property test 用 (RUST-15 parity)
